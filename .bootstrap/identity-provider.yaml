apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - htpasswd:
      fileData:
        name: htpasswd
    mappingMethod: claim
    name: htpasswd_provider
    type: HTPasswd
  - name: github
    mappingMethod: claim 
    type: GitHub
    github:
      clientID: 7dde181b710ec4b321fb
      clientSecret: 
        name: github-oauth
      organizations: 
      - dora-metrics
